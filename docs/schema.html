<style>
/* One full-height pan and zoom canvas. Six hues mark the six table families. */
:root {
  --bg: #EDF0EF; --surface: #FFFFFF; --ink: #17201E; --muted: #5B6864; --line: #C4CDC9; --faint: #DFE5E2;

  --heb: "Noto Serif Hebrew", "SBL Hebrew", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #19201E; --ink: #E3E9E6; --muted: #95A29D; --line: #34403C; --faint: #26302D;
    --text: #9DADB8; --dict: #6FA8EC; --ent: #4CC1A6; --event: #E3A04B; --gram: #EB7D96; --pass: #A892F0;

  }
}

body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
main { margin: 0 auto; padding-inline: clamp(16px, 3vw, 40px); padding-block: 24px; display: grid; gap: 20px; }
section { display: grid; gap: 12px; min-width: 0; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; }
h2 { font: 700 19px/1.2 var(--sans); margin: 0; text-wrap: balance; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 12px var(--mono); color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend button { font: inherit; color: inherit; background: none; border: 0; padding: 2px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

.legend svg { overflow: visible; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: currentColor; display: inline-block; }
.hint { font: 12px var(--mono); color: var(--muted); }
:focus-visible { outline: 2px solid var(--dict); outline-offset: 2px; }

.erd-view { position: relative; height: calc(100vh - 150px); min-height: 420px; overflow: hidden; background: var(--surface) radial-gradient(var(--faint) 1px, transparent 1.3px) 0 0 / 18px 18px; border: 1px solid var(--line); border-radius: 12px; cursor: grab; touch-action: none; user-select: none; }
.erd-view.panning { cursor: grabbing; }
.erd-view > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.zoom { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 4px; z-index: 4; }
.zoom button { font: 600 13px var(--mono); min-width: 36px; height: 32px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; cursor: pointer; }
.zoom button:hover { background: var(--faint); }
#panel { top: 12px; right: 12px; max-height: calc(100% - 24px); cursor: auto; user-select: text; }
.tbl { cursor: pointer; transition: opacity .15s; }
.tbl .frame { fill: var(--surface); stroke: currentColor; stroke-opacity: .55; stroke-width: 1.2; }
.tbl .hd { fill: currentColor; fill-opacity: .16; }
.tbl.empty .hd { fill: url(#hatch); }
.tbl:hover .frame { stroke-opacity: 1; }
.tbl.sel .frame { stroke-opacity: 1; stroke-width: 2.6; }
.tbl .tn { font: 600 12.5px var(--mono); fill: currentColor; }
.tbl .tc { font: 11px var(--mono); fill: var(--muted); text-anchor: end; font-variant-numeric: tabular-nums; }
.tbl .cn { font: 11.5px var(--mono); fill: var(--ink); }
.tbl .ct { font: 10.5px var(--mono); fill: var(--muted); text-anchor: end; }
.tbl .stripe { fill: var(--faint); fill-opacity: .5; }
.tbl .pk { fill: var(--event); }
.tbl .fkm { fill: var(--dict); }
.edge { transition: opacity .15s; }
.edge .ln, .edge .mk { fill: none; stroke: var(--muted); stroke-opacity: .5; stroke-width: 1.2; }
.edge.on .ln, .edge.on .mk { stroke: currentColor; stroke-opacity: 1; stroke-width: 2.2; }
svg.focus .tbl:not(.on) { opacity: .25; }
svg.focus .edge:not(.on) { opacity: .06; }
.cap { font: 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.refs { display: flex; flex-wrap: wrap; gap: 5px 6px; align-items: center; }
.refs .cap { margin-right: 4px; }
.chip { font: 12px var(--mono); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; cursor: pointer; }
.chip:hover, .chip:focus-visible { border-color: currentColor; }
.pop { position: absolute; z-index: 5; width: 460px; max-width: calc(100vw - 48px); max-height: 460px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 14px 40px rgb(0 0 0 / .16); padding: 14px 16px 16px; display: grid; gap: 12px; }
.pop-top { display: flex; align-items: baseline; gap: 10px; }
.pop-top .t { font: 600 16px var(--mono); }
.pop-top .n { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.pop-top button { margin-left: auto; font: 18px/1 var(--sans); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.pop-top button:hover { color: var(--ink); background: var(--faint); }
.rows { overflow-x: auto; border-top: 1px solid var(--faint); padding-top: 10px; }
.rows table { border-collapse: collapse; font: 11.5px var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rows th { text-align: left; color: var(--muted); font-weight: 400; padding: 2px 12px 4px 0; border-bottom: 1px solid var(--faint); }
.rows td { padding: 3px 12px 3px 0; border-bottom: 1px solid var(--faint); }
.rows td.null { color: var(--line); }
.rows td.heb { font-family: var(--heb); font-size: 14px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

];
const GROUP_OF = {};
GROUPS.forEach(g => g.tables.forEach(t => GROUP_OF[t] = g.id));

const LANES = [
  ['clause_role', 'clause_part', 'link_kind', 'structure_kind', 'structure_part', 'summary_kind', 'summary'],
  ['clause', 'sentence', 'passage_link', 'structure', 'verse_range'],
  ['work', 'edition', 'book', 'edition_book', 'word'],
  ['word_match', 'word_headword', 'part_of_speech', 'headword', 'meaning', 'word_meaning'],
  ['mention_kind', 'mention', 'entity_book', 'entity_name', 'journey'],
  ['entity_type', 'entity', 'speech_listener', 'speech', 'speech_mode'],
  ['relationship_kind', 'relationship', 'relationship_evidence', 'counting_system', 'date'],
];
const HEAD = 30, ROWH = 19, TW = 256, LANE = 330, PADX = 70, PADY = 60, GAP = 34;
const tableH = t => HEAD + T[t].columns.length * ROWH + 8;
const LANE_H = LANES.map(l => l.reduce((s, t) => s + tableH(t), 0) + GAP * (l.length - 1));
const W = PADX * 2 + (LANES.length - 1) * LANE + TW, H = PADY * 2 + Math.max(...LANE_H);
const BOX = {};
LANES.forEach((lane, li) => {
  let y = PADY + (Math.max(...LANE_H) - LANE_H[li]) / 2;
  lane.forEach(t => { BOX[t] = { x: PADX + li * LANE, y, w: TW, h: tableH(t), lane: li }; y += tableH(t) + GAP; });
});

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => n.toLocaleString('en-US');
const short = n => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'k' : fmt(n);
const gcol = t => `var(--${GROUP_OF[t]})`;
const rowY = (t, col) => BOX[t].y + HEAD + T[t].columns.findIndex(c => c.name === col) * ROWH + ROWH / 2;

function edgePath(src, scol, dst, dcol) {
  const A = BOX[src], B = BOX[dst], y1 = rowY(src, scol), y2 = rowY(dst, dcol);
  let x1, x2, s1, s2;
  if (A.lane === B.lane) { x1 = x2 = A.x + A.w; s1 = s2 = 1; }
  else if (B.lane > A.lane) { x1 = A.x + A.w; x2 = B.x; s1 = 1; s2 = -1; }
  else { x1 = A.x; x2 = B.x + B.w; s1 = -1; s2 = 1; }
  const bend = A.lane === B.lane ? 34 + Math.min(70, Math.abs(y2 - y1) * 0.12) : Math.max(46, Math.abs(x2 - x1) * 0.42);
  const d = `M${x1},${y1} C${x1 + s1 * bend},${y1} ${x2 + s2 * bend},${y2} ${x2},${y2}`;
  const crow = `M${x1 + s1 * 11},${y1} L${x1},${y1 - 5} M${x1 + s1 * 11},${y1} L${x1},${y1 + 5}`;
  const one = `M${x2 + s2 * 7},${y2 - 5} L${x2 + s2 * 7},${y2 + 5} M${x2 + s2 * 11},${y2 - 5} L${x2 + s2 * 11},${y2 + 5}`;
  return `<path class="ln" d="${d}"/><path class="mk" d="${crow} ${one}"/>`;
}

function buildERD() {
  const links = [];
  let edges = '', boxes = '';
  for (const t of Object.keys(BOX)) {
    T[t].columns.filter(c => c.fk).forEach(c => {
      const i = links.length;
      links.push([t, c.fk]);
      edges += `<g class="edge" data-i="${i}" style="color:${gcol(t)}"><title>${t}.${c.name} → ${c.fk}.${c.fkcol}</title>${edgePath(t, c.name, c.fk, c.fkcol)}</g>`;
    });
  }
  for (const [t, B] of Object.entries(BOX)) {
    const n = T[t].count;
    let rows = '';
    T[t].columns.forEach((c, i) => {
      const y = B.y + HEAD + i * ROWH + ROWH / 2;
      if (i % 2) rows += `<rect class="stripe" x="${B.x + 1}" y="${y - ROWH / 2}" width="${B.w - 2}" height="${ROWH}"/>`;
      if (c.pk) rows += `<circle class="pk" cx="${B.x + 12}" cy="${y}" r="3.6"/>`;
      if (c.fk) rows += `<path class="fkm" d="M${B.x + (c.pk ? 22 : 12)},${y - 4.2} l4.2,4.2 l-4.2,4.2 l-4.2,-4.2z"/>`;
      rows += `<text class="cn${c.fk ? ' isfk' : ''}" x="${B.x + 32}" y="${y + 4}">${c.name}</text><text class="ct" x="${B.x + B.w - 10}" y="${y + 4}">${c.type.toLowerCase()}</text>`;
    });
    boxes += `<g class="tbl${n ? '' : ' empty'}" data-t="${t}" tabindex="0" role="button" aria-label="${t}, ${fmt(n)} rows" style="color:${gcol(t)}">` +
      `<rect class="frame" x="${B.x}" y="${B.y}" width="${B.w}" height="${B.h}" rx="6"/>` +
      `<path class="hd" d="M${B.x},${B.y + HEAD} V${B.y + 6} a6,6 0 0 1 6,-6 H${B.x + B.w - 6} a6,6 0 0 1 6,6 V${B.y + HEAD}z"/>` +
      `<text class="tn" x="${B.x + 10}" y="${B.y + 20}">${t}</text><text class="tc" x="${B.x + B.w - 10}" y="${B.y + 20}">${n ? short(n) : 'empty'}</text>` +
      rows + `</g>`;
  }
  const defs = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" style="stroke:currentColor;stroke-opacity:.35;stroke-width:2"/></pattern></defs>`;
  return { svg: `<svg id="erd" role="img" aria-label="Entity relationship diagram">${defs}<g class="edges">${edges}</g>${boxes}<g class="top"></g></svg>`, links };
}


function panelHTML(t) {
  const tb = T[t], all = tb.rows.length === tb.count;
  const out = [...new Set(tb.columns.filter(c => c.fk).map(c => c.fk))];
  const inn = [...new Set(Object.keys(T).filter(o => T[o].columns.some(c => c.fk === t)))];
  const chips = list => list.map(o => `<button class="chip" data-go="${o}" style="color:${gcol(o)}">${o}</button>`).join('');
  const isHeb = v => typeof v === 'string' && /[֐-׿]/.test(v);
  const rows = tb.rows.length ? `<div class="rows"><div class="cap">${all ? 'all rows' : 'sample rows'}</div><table><tr>${tb.columns.map(c => `<th>${c.name}</th>`).join('')}</tr>` +
    tb.rows.map(r => `<tr>${r.map(v => v === null || v === '' ? `<td class="null">∅</td>` : `<td${isHeb(v) ? ' class="heb"' : ''}>${esc(v)}</td>`).join('')}</tr>`).join('') + `</table></div>` : `<div class="cap">no rows yet</div>`;
  return `<div class="pop-top"><span class="t" style="color:${gcol(t)}">${t}</span><span class="n">${fmt(tb.count)} rows</span><button aria-label="Close" data-close>×</button></div>` +
    (out.length ? `<div class="refs"><span class="cap">points to</span>${chips(out)}</div>` : '') +
    (inn.length ? `<div class="refs"><span class="cap">pointed to by</span>${chips(inn)}</div>` : '') + rows;
}

function boot() {
  const groups = document.getElementById('groups');
  groups.innerHTML = GROUPS.map(g => `<button data-g="${g.id}" style="color:var(--${g.id})"><span class="dot"></span><span style="color:var(--muted)">${g.name}</span></button>`).join('');

  const view = document.getElementById('erd-view');
  const { svg, links } = buildERD();
  view.insertAdjacentHTML('afterbegin', svg);
  const svgEl = view.querySelector('svg');
  const edgeEls = [...svgEl.querySelectorAll('.edge')];
  const tblEls = [...svgEl.querySelectorAll('.tbl')];
  const edgeLayer = svgEl.querySelector('.edges'), topLayer = svgEl.querySelector('.top');
  const panel = document.getElementById('panel');
  let sel = null;

  const cam = { x: 0, y: 0, k: 1 };
  const apply = () => svgEl.setAttribute('viewBox', `${cam.x} ${cam.y} ${view.clientWidth / cam.k} ${view.clientHeight / cam.k}`);
  function fit() {
    const k = Math.min(view.clientWidth / W, view.clientHeight / H);
    cam.k = k; cam.x = -(view.clientWidth / k - W) / 2; cam.y = -(view.clientHeight / k - H) / 2;
    apply();
  }
  function zoomAt(f, sx, sy) {
    const k = Math.min(3, Math.max(0.15, cam.k * f));
    const wx = cam.x + sx / cam.k, wy = cam.y + sy / cam.k;
    cam.k = k; cam.x = wx - sx / k; cam.y = wy - sy / k;
    apply();
  }
  function centerOn(t) {
    const B = BOX[t];
    if (cam.k < 0.8) cam.k = 0.9;
    const vw = view.clientWidth - (panel.hidden ? 0 : panel.offsetWidth + 24);
    cam.x = B.x + B.w / 2 - vw / 2 / cam.k; cam.y = B.y + B.h / 2 - view.clientHeight / 2 / cam.k;
    apply();
  }

  function focus(set, test) {
    svgEl.classList.toggle('focus', !!set);
    tblEls.forEach(b => b.classList.toggle('on', !!set && set.has(b.dataset.t)));
    edgeEls.forEach(e => {
      const on = !!set && test(links[+e.dataset.i]);
      e.classList.toggle('on', on);
      (on ? topLayer : edgeLayer).appendChild(e);
    });
  }
  let shown;
  function focusTable(t) {
    if (t === shown) return;
    shown = t;
    if (!t) return focus(null);
    const set = new Set([t]);
    links.forEach(([a, b]) => { if (a === t) set.add(b); if (b === t) set.add(a); });
    focus(set, ([a, b]) => a === t || b === t);
  }
  function select(t, move) {
    sel = t;
    tblEls.forEach(b => b.classList.toggle('sel', b.dataset.t === t));
    focusTable(t);
    if (!t) { panel.hidden = true; return; }
    panel.innerHTML = panelHTML(t);
    panel.hidden = false;
    if (move) centerOn(t);
  }

  let drag = null;
  view.addEventListener('pointerdown', e => {
    if (e.target.closest('#panel, .zoom')) return;
    drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, target: e.target.closest('.tbl') };
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    view.classList.add('panning');
    cam.x = drag.cx - dx / cam.k; cam.y = drag.cy - dy / cam.k;
    apply();
  });
  view.addEventListener('pointerup', () => {
    if (drag && !drag.moved) {
      const t = drag.target?.dataset.t;
      select(t && t !== sel ? t : null);
    }
    drag = null;
    view.classList.remove('panning');
  });
  view.addEventListener('wheel', e => {
    if (e.target.closest('#panel')) return;
    e.preventDefault();
    const r = view.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    else { cam.x += e.deltaX / cam.k; cam.y += e.deltaY / cam.k; apply(); }
  }, { passive: false });
  svgEl.addEventListener('mouseover', e => { if (!sel && !drag) focusTable(e.target.closest('.tbl')?.dataset.t); });
  svgEl.addEventListener('mouseleave', () => { if (!sel) focusTable(null); });
  svgEl.addEventListener('keydown', e => {
    const b = e.target.closest('.tbl');
    if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(b.dataset.t, true); }
  });
  panel.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { const t = sel; select(null); svgEl.querySelector(`[data-t="${t}"]`)?.focus({ preventScroll: true }); }

    if (go) select(go.dataset.go, true);
